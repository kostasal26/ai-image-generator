<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 600;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 30px 0;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result {
            display: none;
            margin-top: 40px;
            text-align: center;
        }
        
        .result img {
            max-width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
        }
        
        .prompt-display {
            color: #666;
            font-style: italic;
            margin-bottom: 15px;
        }
        
        .error {
            background-color: #fee;
            border-left: 4px solid #f66;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success {
            background-color: #efe;
            border-left: 4px solid #6f6;
            color: #3c3;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 AI Image Generator</h1>
        <p class="subtitle">Generate stunning images from text descriptions</p>
        
        <div class="error" id="error"></div>
        <div class="success" id="success"></div>
        
        <div class="input-group">
            <label for="prompt">Describe your image:</label>
            <textarea id="prompt" placeholder="Example: A majestic dragon flying over a mystical mountain landscape at sunset"></textarea>
        </div>
        
        <button id="generateBtn" onclick="generateImage()">Generate Image</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Creating your masterpiece... This may take a moment ✨</p>
        </div>
        
        <div class="result" id="result">
            <p class="prompt-display">Prompt: <strong id="resultPrompt"></strong></p>
            <img id="resultImage" alt="Generated image">
        </div>
    </div>
    
    <script>
        async function generateImage() {
            const prompt = document.getElementById('prompt').value.trim();
            const generateBtn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            
            // Reset messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            result.style.display = 'none';
            
            // Validation
            if (!prompt) {
                errorDiv.textContent = '⚠️ Please enter a description!';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (prompt.length > 500) {
                errorDiv.textContent = '⚠️ Description too long (max 500 characters)';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Disable button and show loading
            generateBtn.disabled = true;
            loading.style.display = 'block';
            
            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt: prompt})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('resultImage').src = data.image_url;
                    document.getElementById('resultPrompt').textContent = data.prompt;
                    result.style.display = 'block';
                    successDiv.textContent = '✅ Image generated successfully!';
                    successDiv.style.display = 'block';
                } else {
                    throw new Error(data.error || 'Failed to generate image');
                }
            } catch (error) {
                errorDiv.textContent = '❌ Error: ' + error.message;
                errorDiv.style.display = 'block';
            } finally {
                generateBtn.disabled = false;
                loading.style.display = 'none';
            }
        }
        
        // Allow Enter key to generate
        document.getElementById('prompt').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                generateImage();
            }
        });
    </script>
</body>
</html>
